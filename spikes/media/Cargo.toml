[package]
name = "media-spike"
default-run = "media-spike"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
desktop = ["dep:gpui", "dep:image"]

[[bin]]
name = "whisk-desktop-spike"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "whisk-audio-spike"
path = "src/audio_desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "whisk-speaker-spike"
path = "src/speaker_desktop.rs"
required-features = ["desktop"]

[dependencies]
futures-util = "0.3"
gpui = { version = "=0.2.2", optional = true, features = ["runtime_shaders"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
livekit = { version = "=0.9.7", features = ["rustls-tls-native-roots"] }
livekit-signaling = "=0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=11.1.0"

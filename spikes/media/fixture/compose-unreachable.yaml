# Test-only SFU: signaling is reachable, RTC UDP/TCP ports are not published.
services:
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.2"]
    environment:
      LIVEKIT_CONFIG: |
        rtc:
          use_external_ip: false
          stun_servers:
            - "127.0.0.1:9"
          use_ice_lite: true
    ports:
      - "127.0.0.1::7880"

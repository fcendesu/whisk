name: Native Rust probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test deterministic probe behavior
        run: cargo test --workspace --all-features --locked
      - name: Test resource sampler filtering
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check operator shell scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Build native preview
        run: cargo build --locked -p media-spike --features desktop --bin whisk-desktop-spike
      - name: Lint native targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
